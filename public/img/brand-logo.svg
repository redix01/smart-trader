  <text x="56" y="75" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#d8b878" text-anchor="middle">NM</text>
  <!-- Wordmark -->
  <text x="130" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="0.2">
    <tspan fill="#ffffff">Nano Market </tspan><tspan fill="#d8b878" font-style="italic">Pro</tspan>
  </text>
